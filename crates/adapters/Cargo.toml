[package]
name = "cerulean-adapters"
version.workspace = true
edition.workspace = true
[features]
test-fixtures = []
[dependencies]
cerulean-domain = { path = "../domain" }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
base64 = "0.22.1"
dunce = "1.0.5"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json"] }
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "io-util", "sync", "time"] }
