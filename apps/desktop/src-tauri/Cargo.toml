[package]
name = "cerulean-desktop"
version.workspace = true
edition.workspace = true
[features]
custom-protocol = ["tauri/custom-protocol"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
cerulean-domain = { path = "../../../crates/domain" }
cerulean-core = { path = "../../../crates/core" }
cerulean-cache = { path = "../../../crates/cache" }
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
tokio = { version = "1", features = ["process", "io-util", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Environment", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
