[workspace]
members = ["crates/domain", "crates/core", "crates/adapters", "apps/desktop/src-tauri"]
default-members = ["crates/domain", "crates/core", "crates/adapters"]
resolver = "2"

[workspace.package]
version = "0.1.39"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
ts-rs = { version = "11", features = ["serde-compat"] }

[patch.crates-io]
# ts-rs 11.1.0 enum serde compatibility must recognize strict decoding guards.
ts-rs-macros = { path = "vendor/ts-rs-macros" }
