name: CeruleanLonging checks
on: [push, pull_request]
jobs:
  windows-foundation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: npm ci
      - run: ./scripts/check.ps1
        env:
          CERULEAN_RUN_NATIVE_ACCOUNT_TESTS: '1'
          CERULEAN_CI_CORE_TEST_MEMORY_GIB: '4'
      - name: Check generated contract drift
        run: git diff --exit-code -- apps/desktop/src/contracts.ts
      - name: Build core and desktop
        run: npm run desktop:build
      - name: Rust lint and sidecar isolation
        run: ./scripts/lint.ps1
