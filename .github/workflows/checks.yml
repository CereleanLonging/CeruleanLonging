name: CeruleanLonging checks
on: [push, pull_request]
jobs:
  windows-foundation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Prepare reviewed packaging tools
        run: python ./.github/scripts/prepare-reviewed-tools.py
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: npm ci
      - name: Validate packaging inputs before compilation
        run: |
          cargo fetch --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ./scripts/sqlite-notices.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ./scripts/distribution-notices.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - run: ./scripts/check.ps1
        env:
          CERULEAN_RUN_NATIVE_ACCOUNT_TESTS: '1'
          CERULEAN_CI_CORE_TEST_MEMORY_GIB: '4'
      - name: Check generated contract drift
        run: git diff --exit-code -- apps/desktop/src/contracts.ts
      - name: Build Windows installer
        run: npm run desktop:package
      - name: Validate Windows candidate
        if: github.event_name == 'push'
        run: ./.github/scripts/stage-windows-candidate.ps1
      - name: Rust lint and sidecar isolation
        run: ./scripts/lint.ps1
      - name: Retain validated Windows candidate
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: windows-candidate-${{ github.sha }}
          path: reports/ci-release-candidate/
          if-no-files-found: error
          retention-days: 7
